name: Kit core drift
on:
  pull_request:
    branches: [release/4.5.0-integration]
    paths:
      - m8shift.py
      - tests/test_kit_core_drift.py
      - checksums.sha256
      - .github/workflows/kit-core-drift.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - run: sha256sum -c checksums.sha256
      - run: python -m unittest discover -s tests -p 'test_kit_core_drift.py' -v
