name: Decision engine checks
on:
  pull_request:
    paths:
      - 'm8shift-decision.py'
      - 'm8shift-routing-bridge.py'
      - 'tests/test_decision_engine.py'
      - 'tests/test_routing_bridge.py'
      - '.github/workflows/decision-engine.yml'
  workflow_dispatch:
jobs:
  decision-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile decision modules
        run: python -m py_compile m8shift-decision.py m8shift-routing-bridge.py
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_decision_engine.py' -v
          python -m unittest discover -s tests -p 'test_routing_bridge.py' -v
