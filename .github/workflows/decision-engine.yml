name: Decision engine checks
on:
  pull_request:
    paths:
      - 'm8shift-decision.py'
      - 'm8shift-routing-bridge.py'
      - 'tests/test_decision_engine.py'
      - 'tests/test_routing_bridge.py'
      - '.github/workflows/decision-engine.yml'
      - '.python-version'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decision-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          check-latest: true
      - name: Record exact source under test
        run: |
          mkdir -p evidence
          python --version > evidence/python-version.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git archive --format=tar.gz --output=evidence/public-source.tar.gz HEAD
          sha256sum evidence/public-source.tar.gz > evidence/source-archive.sha256
      - name: Compile decision modules
        run: python -m py_compile m8shift-decision.py m8shift-routing-bridge.py
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_decision_engine.py' -v 2>&1 | tee evidence/decision-tests.txt
          python -m unittest discover -s tests -p 'test_routing_bridge.py' -v 2>&1 | tee evidence/bridge-tests.txt
      - name: Preserve source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
